name: places_sdk_flutter
description: Flutter plugin wrapping the official Google Places SDK on Android and iOS (autocomplete search + place details).
version: 0.0.4
homepage: https://github.com/satpal002/google_places_flutter
repository: https://github.com/satpal002/google_places_flutter
issue_tracker: https://github.com/satpal002/google_places_flutter/issues

publisher: satpalyadav.in

environment:
  sdk: ^3.10.0
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.example.google_places_flutter
        pluginClass: GooglePlacesFlutterPlugin
      ios:
        pluginClass: GooglePlacesFlutterPlugin
